spring:
  datasource:
    url: jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:local-development-secret-key-at-least-256-bits-long}

logging:
  level:
    com.elhachmi.portfolio: DEBUG
    org.springframework.security: DEBUG
